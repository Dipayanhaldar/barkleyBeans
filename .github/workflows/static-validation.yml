name: Static app validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static PWA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required application files
        run: |
          test -f barkley-beans-studio/index.html
          test -f barkley-beans-studio/manifest.webmanifest
          test -f barkley-beans-studio/sw.js
          test -f barkley-beans-studio/icon.svg

      - name: Validate PWA manifest JSON
        run: python -c "import json; json.load(open('barkley-beans-studio/manifest.webmanifest', encoding='utf-8'))"

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("barkley-beans-studio/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.IGNORECASE)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript block found to validate.")
          Path("/tmp/barkley-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript block(s).")
          PY
          node --check /tmp/barkley-inline.js

      - name: Validate service worker JavaScript syntax
        run: node --check barkley-beans-studio/sw.js
